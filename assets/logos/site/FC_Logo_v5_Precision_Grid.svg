<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Felipe Comunello - Logo v5 Precision</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
      .logo-text { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; fill: #1a1a1a; letter-spacing: -1.5px; }
      .logo-text-primary { font-size: 90px; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="transparent"/>
  
  <!-- Logo base structure -->
  <g transform="translate(50, 150)">
    <!-- Fel -->
    <text x="0" y="100" class="logo-text logo-text-primary">Fel</text>
    
    <!-- Grid de pontos - Precisão -->
    <g transform="translate(200, 70)">
      <!-- Top row -->
      <circle cx="-10" cy="-10" r="3" fill="#4a9d3d"/>
      <circle cx="0" cy="-10" r="3" fill="#4a9d3d"/>
      <circle cx="10" cy="-10" r="3" fill="#4a9d3d"/>
      
      <!-- Middle row -->
      <circle cx="-10" cy="0" r="3" fill="#4a9d3d"/>
      <circle cx="0" cy="0" r="5" fill="#4a9d3d"/> <!-- Central emphasis -->
      <circle cx="10" cy="0" r="3" fill="#4a9d3d"/>
      
      <!-- Bottom row -->
      <circle cx="-10" cy="10" r="3" fill="#4a9d3d"/>
      <circle cx="0" cy="10" r="3" fill="#4a9d3d"/>
      <circle cx="10" cy="10" r="3" fill="#4a9d3d"/>
    </g>
    
    <!-- pe -->
    <text x="260" y="100" class="logo-text logo-text-primary">pe</text>
  </g>
  
  <!-- Metadata -->
  <text x="50" y="380" font-family="Inter, sans-serif" font-size="12" fill="#999" letter-spacing="0.5px">Precision & Data</text>
</svg>