<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Felipe Comunello - Logo v4 Impact</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
      .logo-text { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; fill: #1a1a1a; letter-spacing: -1.5px; }
      .logo-text-primary { font-size: 90px; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="transparent"/>
  
  <!-- Logo base structure -->
  <g transform="translate(50, 150)">
    <!-- Fel -->
    <text x="0" y="100" class="logo-text logo-text-primary">Fel</text>
    
    <!-- Ondas concêntricas - Impacto -->
    <g transform="translate(200, 70)">
      <!-- Central dot -->
      <circle cx="0" cy="0" r="7" fill="#0066cc" opacity="0.9"/>
      <!-- Wave 1 -->
      <circle cx="0" cy="0" r="15" fill="none" stroke="#0066cc" stroke-width="1.8" opacity="0.6"/>
      <!-- Wave 2 -->
      <circle cx="0" cy="0" r="24" fill="none" stroke="#0066cc" stroke-width="1.2" opacity="0.3"/>
    </g>
    
    <!-- pe -->
    <text x="260" y="100" class="logo-text logo-text-primary">pe</text>
  </g>
  
  <!-- Metadata -->
  <text x="50" y="380" font-family="Inter, sans-serif" font-size="12" fill="#999" letter-spacing="0.5px">Impact & Resonance</text>
</svg>